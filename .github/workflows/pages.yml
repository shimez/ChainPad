name: Build firmware and deploy Web Installer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'site/**'
      - 'scripts/**'
      - 'tests/check_image.py'
      - 'tests/test_presets.cjs'
      - 'platformio.ini'
      - 'partitions*.csv'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Validate preset formats
        run: node tests/test_presets.cjs
      - name: Build all four boards
        run: pio run
      - name: Validate firmware images
        run: python tests/check_image.py --env xiao_esp32s3 xiao_esp32c3 xiao_esp32c6 xiao_esp32c5
      - name: Package installer and firmware
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
