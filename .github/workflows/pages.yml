name: Validate main and publish tagged firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'boards/**'
      - 'web/**'
      - 'site/**'
      - 'scripts/**'
      - 'CHANGELOG.md'
      - 'tests/test_changelog.py'
      - 'tests/test_history_distribution.py'
      - 'tests/check_image.py'
      - 'tests/test_presets.cjs'
      - 'tests/test_hid_action_ui.cjs'
      - 'tests/test_stop_chain_save.cjs'
      - 'tests/test_rotation_preview.cjs'
      - 'tests/test_firmware_update.cjs'
      - 'tests/test_build_site.py'
      - 'tests/test_publish_release.py'
      - 'tests/test_release_plan.py'
      - 'platformio.ini'
      - 'partitions*.csv'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      force_firmware:
        description: 'Force validation builds on main (firmware publication requires a version tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.firmware.outputs.deploy }}
      release: ${{ steps.firmware.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pages dependencies
        run: python -m pip install -r scripts/requirements-pages.txt
      - name: Test Pages packaging
        run: python -m unittest discover -s tests -p test_build_site.py
      - name: Test history generation and distribution
        run: |
          python -m unittest discover -s tests -p test_changelog.py
          python -m unittest discover -s tests -p test_history_distribution.py
      - name: Test Release publishing
        run: python -m unittest discover -s tests -p test_publish_release.py
      - name: Test tag and main publication policy
        run: python -m unittest discover -s tests -p test_release_plan.py
      - name: Select validation or tagged publication
        id: firmware
        env:
          FORCE_FIRMWARE: ${{ inputs.force_firmware || false }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/release_plan.py
      - name: Install PlatformIO
        if: steps.firmware.outputs.rebuild == 'true'
        run: pip install platformio==6.1.19
      - name: Validate preset formats
        if: steps.firmware.outputs.rebuild == 'true'
        run: node tests/test_presets.cjs
      - name: Validate Rotation Preview calculations
        run: node tests/test_rotation_preview.cjs
      - name: Validate firmware update notification
        run: node --test tests/test_firmware_update.cjs
      - name: Validate Action editing and Stop Chain save/load
        run: |
          node tests/test_hid_action_ui.cjs
          node tests/test_stop_chain_save.cjs
      - name: Build all four boards
        if: steps.firmware.outputs.rebuild == 'true'
        run: pio run
      - name: Validate firmware images
        if: steps.firmware.outputs.rebuild == 'true'
        run: python tests/check_image.py --env xiao_esp32s3 xiao_esp32c3 xiao_esp32c6 xiao_esp32c5
      - name: Package installer and firmware
        if: steps.firmware.outputs.release == 'true'
        run: python scripts/build_site.py
      - name: Update Pages content with existing firmware
        if: steps.firmware.outputs.release != 'true'
        run: python scripts/build_site.py --site-only
      - name: Verify tagged distribution before deploying
        if: steps.firmware.outputs.release == 'true'
        run: python scripts/publish_release.py _site --validate-only --require-tag
      - name: Verify preserved distribution before deploying
        if: steps.firmware.outputs.release != 'true'
        run: python scripts/publish_release.py _site --validate-only
      - uses: actions/configure-pages@v6
        if: steps.firmware.outputs.deploy == 'true'
      - name: Retain firmware for Release publishing
        if: steps.firmware.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: |
            _site/build.json
            _site/manifest.json
            _site/changes.json
            _site/firmware/*.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: steps.firmware.outputs.deploy == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
  release:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.build.outputs.release == 'true' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release
          path: release-assets
      - name: Publish new firmware version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py release-assets --require-tag
