<style>
:root{color-scheme:light dark;--bg:#10151d;--panel:#1b2330;--text:#eef5ff;--muted:#a9b8cc;--line:#374557;--accent:#66dbc1;font:16px system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{width:min(860px,calc(100% - 32px));margin:auto}
nav{display:flex;gap:20px;flex-wrap:wrap;padding:24px 0;border-bottom:1px solid var(--line)}a{color:var(--accent);text-underline-offset:4px}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
article{padding:36px 0 48px;line-height:1.85;overflow-wrap:anywhere}h1{font-size:clamp(30px,6vw,46px);line-height:1.3}h2{margin-top:2em;border-bottom:1px solid var(--line);padding-bottom:.3em}h3{margin-top:1.6em}h1,h2,h3,h4{scroll-margin-top:20px}
img,video{max-width:100%;height:auto}pre{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;line-height:1.6}code{font-size:.9em}blockquote{margin:1.5em 0;padding:.3em 1em;border-left:4px solid var(--accent);background:var(--panel)}
table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px 12px;text-align:left}th{background:var(--panel)}.toc{padding:12px 20px;border:1px solid var(--line);border-radius:8px}footer{padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
@media(prefers-color-scheme:light){:root{--bg:#f3f6f8;--panel:#fff;--text:#182a38;--muted:#506275;--line:#bdcbd5;--accent:#087565}}
</style>
