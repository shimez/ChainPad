; Explicit hardware test build. No credentials are compiled into the image.
[platformio]
extra_configs = platformio.ini
build_dir = .pio/build-obs-test
default_envs = xiao_esp32s3_obs_test

[env:xiao_esp32s3_obs_test]
extends = env:xiao_esp32s3
build_flags =
  ${env:xiao_esp32s3.build_flags}
  -DCHAINPAD_OBS_TEST=1

; Compile the buffered S3 trace path as well as the existing C6 trace build.
[env:xiao_esp32s3_obs_trace]
extends = env:xiao_esp32s3_obs_test
build_flags =
  ${env:xiao_esp32s3_obs_test.build_flags}
  -DCHAINPAD_HID_TRACE=1
