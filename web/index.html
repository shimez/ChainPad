<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChainPad — Project Chimera</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1b2330;--line:#374557;--accent:#66dbc1;--muted:#a9b8cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5ff;font:15px system-ui,sans-serif}header,main{max-width:1150px;margin:auto;padding:22px}header{border-bottom:1px solid var(--line)}h1{margin:0;font-size:30px}small,.hint{color:var(--muted)}h2{font-size:20px;margin-top:0}button,input,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px;background:#111923;color:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#10231f;font-weight:700}button:disabled{opacity:.4;cursor:default}input,select{width:100%}input[type=checkbox]{width:auto}label{display:grid;gap:5px;font-size:13px}main{display:grid;grid-template-columns:225px 1fr;gap:18px}.panel,article,details{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:10px}.network,.status,.toolbar,#message{grid-column:1/-1}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}#inputs{display:grid;gap:7px}#inputs button{text-align:left}#inputs button.active{border-color:var(--accent);color:var(--accent)}#actions{display:grid;gap:12px;margin:15px 0}.action-head,.toolbar,.buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.action-head{justify-content:space-between;margin-bottom:15px}.tag{display:inline-block;margin:3px;padding:4px 8px;background:#10151d;border-radius:6px;color:var(--muted)}.tag.on{color:var(--accent)}#message{white-space:pre-wrap;color:var(--accent);min-height:22px}.error{color:#ff9d99!important}.modifiers{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.modifiers label{display:flex;align-items:center}summary{cursor:pointer;margin-bottom:12px}.danger{color:#ffb8a8}#stats{font-size:12px;margin-top:8px;overflow-wrap:anywhere}@media(max-width:700px){main{grid-template-columns:1fr}#inputs{grid-template-columns:repeat(3,1fr)}header,main{padding:14px}}
:root{--text:#eef5ff;--field:#111923;--error:#ff9d99;--danger:#ffb8a8;--primary-text:#10231f}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6f8;--panel:#ffffff;--line:#bdcbd5;--accent:#087565;--muted:#506275;--text:#182a38;--field:#f8fafc;--error:#b42318;--danger:#a52d20;--primary-text:#ffffff}
body{color:var(--text)}button,input,select{background:var(--field)}button.primary{color:var(--primary-text)}.tag{background:var(--bg)}.error{color:var(--error)!important}.danger{color:var(--danger)}.header-row{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.theme-choice{min-width:150px}
</style>
<style>
header,main{max-width:1280px;padding-left:16px;padding-right:16px}
.fields{align-items:start}.fields>label{align-content:start;min-width:0}.fields>label>input,.fields>label>select{height:42px;min-width:0}
@media(min-width:1100px){main{grid-template-columns:200px minmax(0,1fr)}.fields.midi{grid-template-columns:1.2fr 1.4fr 1.2fr .65fr .65fr .65fr;gap:10px}}
</style>
<script>
try{const theme=localStorage.getItem('chainpad-theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;}catch{}
</script>
<header><div class="header-row"><div><small>PROJECT CHIMERA · PHASE 1</small><h1>ChainPad</h1></div><label class="theme-choice">表示テーマ / Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label></div><p class="hint">Physical Input → Input Event → Action Chain</p></header>
<main>
<section class="status panel"><div id="connections">接続中…</div><div id="stats"></div></section>
<section class="network panel" id="oscDestination"><h2>OSC送信先</h2><div class="fields">
<label>OSC IPv4<input id="oscHost" placeholder="192.168.1.100"></label>
<label>OSC Port<input id="oscPort" type="number" min="1" max="65535"></label>
</div><p class="hint">全OSC Action共通の送信先です。変更後は「保存・適用」を押してください。</p></section>
<nav class="panel"><h2>Input</h2><div id="inputs"></div></nav>
<section><div class="panel"><h2 id="title">Action Chain</h2><label>Input Event<select id="event"></select></label><p class="hint">登録順に即時実行。PressとReleaseは別のChainです。最大8 Actions / Event。</p><div class="buttons"><button id="example">3 Protocolの設定例を配置</button><button id="trigger">保存済みEventをテスト</button></div></div><div id="actions"></div><button id="add">+ Add Action</button></section>
<div class="toolbar"><button class="primary" id="save">保存・適用</button><button id="reload">保存済み設定を読み込み</button><button class="danger" id="panic">Panic / 全出力解放</button><button id="restart">Restart</button><span id="dirty" class="hint"></span></div>
<div id="message" role="status"></div>
<details class="network" id="network"><summary>Wi-Fi設定</summary><div class="fields">
<label>Wi-Fi SSID<input id="ssid" maxlength="32" autocomplete="off"></label>
<label>Wi-Fi Password<input id="password" type="password" maxlength="64" autocomplete="new-password"></label>
</div><p class="hint">SSID / Passwordの変更後は「保存・適用」→「Restart」の順に押してください。</p><div class="buttons"><button class="primary" id="networkSave">保存・適用</button><button id="networkRestart">Restart</button></div></details>
</main>
<script>
'use strict';
let config, capabilities, selected=0, dirty=false, statusTimer;
const $=id=>document.getElementById(id);
$('theme').value=document.documentElement.dataset.theme||'dark';
$('theme').onchange=()=>{const theme=$('theme').value;document.documentElement.dataset.theme=theme;try{localStorage.setItem('chainpad-theme',theme);}catch{}};
const names=Array.from({length:12},(_,i)=>`KEY ${String(i+1).padStart(2,'0')}`).concat('Encoder Push','Encoder');
const usageNames={4:'A',5:'B',6:'C',7:'D',8:'E',9:'F',10:'G',11:'H',12:'I',13:'J',14:'K',15:'L',16:'M',17:'N',18:'O',19:'P',20:'Q',21:'R',22:'S',23:'T',24:'U',25:'V',26:'W',27:'X',28:'Y',29:'Z',40:'Enter',41:'Escape',42:'Backspace',43:'Tab',44:'Space',79:'Right',80:'Left',81:'Down',82:'Up'};
for(let i=0;i<10;i++)usageNames[30+i]=String((i+1)%10);
for(let i=0;i<12;i++){usageNames[58+i]=`F${i+1}`;usageNames[104+i]=`F${i+13}`;}
function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error);}
function changed(){dirty=true;$('dirty').textContent='未保存の変更あり';}
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.message||r.statusText);return data;}
function control(label,value,options,onchange,type='text',min,max){const wrap=document.createElement('label');wrap.textContent=label;const el=document.createElement(options?'select':'input');if(options){for(const [v,name]of options){const o=document.createElement('option');o.value=v;o.textContent=name;el.append(o);}}else{el.type=type;if(min!==undefined)el.min=min;if(max!==undefined)el.max=max;}el.value=value;el.onchange=()=>{onchange(type==='number'?Number(el.value):el.value);changed();};wrap.append(el);return wrap;}
function defaults(protocol){if(protocol==='osc')return {protocol,transport:'wifi',delayMs:0,address:'/avatar/parameters/Costume',type:'int',value:2};if(protocol==='midi')return {protocol,transport:capabilities.defaultMidiTransport,delayMs:0,message:'noteOn',channel:1,number:48,value:127};return {protocol,transport:'ble',delayMs:0,message:'keyDown',usage:104,modifiers:0};}
function current(){return config.chains.find(c=>c.input===selected).actions;}
function button(text,fn,disabled=false){const b=document.createElement('button');b.textContent=text;b.onclick=fn;b.disabled=disabled;return b;}
function renderActions(){const list=$('actions');list.replaceChildren();const actions=current();actions.forEach((a,i)=>{const card=document.createElement('article');const head=document.createElement('div');head.className='action-head';const title=document.createElement('strong');title.textContent=`ACTION ${i+1} · ${a.protocol.toUpperCase()}`;const ops=document.createElement('div');ops.className='buttons';ops.append(button('↑',()=>{[actions[i-1],actions[i]]=[actions[i],actions[i-1]];changed();renderActions();},i===0),button('↓',()=>{[actions[i+1],actions[i]]=[actions[i],actions[i+1]];changed();renderActions();},i===actions.length-1),button('削除',()=>{actions.splice(i,1);changed();renderActions();}));head.append(title,ops);card.append(head);const fields=document.createElement('div');fields.className='fields';fields.append(control('Protocol',a.protocol,[['osc','OSC'],['midi','MIDI'],['keyboard','Keyboard HID']],v=>{actions[i]=defaults(v);renderActions();}));
if(a.protocol!=='osc'){
  if(a.protocol==='midi')fields.classList.add('midi');
  const allowed=a.protocol==='midi'?capabilities.midiTransports:capabilities.keyboardTransports;
  const fixed=allowed.length===1;
  const labels={both:'Both (USB + BLE)',usb:'USB',ble:fixed?'BLE（固定）':'BLE'};
  const field=control('Transport',a.transport,allowed.map(t=>[t,labels[t]]),v=>a.transport=v);
  field.lastChild.disabled=fixed;
  if(fixed){const note=document.createElement('small');note.textContent='この機種はBLEのみ対応';field.append(note);}
  fields.append(field);
}
if(a.protocol==='osc'){fields.append(control('Address',a.address,null,v=>a.address=v),control('Type',a.type,[['int','Int'],['float','Float'],['bool','Bool'],['string','String']],v=>{a.type=v;a.value=v==='string'?'':v==='bool'?false:0;renderActions();}));if(a.type==='bool')fields.append(control('Value',String(a.value),[['true','true'],['false','false']],v=>a.value=v==='true'));else{const f=control('Value',a.value,null,v=>a.value=v,a.type==='string'?'text':'number');if(a.type==='float')f.lastChild.step='any';fields.append(f);}}
if(a.protocol==='midi')fields.append(control('Message',a.message,[['noteOn','Note On'],['noteOff','Note Off'],['cc','Control Change']],v=>{a.message=v;a.value=v==='noteOn'?127:0;renderActions();}),control('Channel',a.channel,null,v=>a.channel=v,'number',1,16),control(a.message==='cc'?'Controller':'Note',a.number,null,v=>a.number=v,'number',0,127),control(a.message==='cc'?'Value':'Velocity',a.value,null,v=>a.value=v,'number',a.message==='noteOn'?1:0,127));
if(a.protocol==='keyboard'){fields.append(control('Message',a.message,[['keyDown','KeyDown'],['keyUp','KeyUp'],['releaseAll','Release All']],v=>{a.message=v;renderActions();}));if(a.message!=='releaseAll')fields.append(control('Key (HID Usage)',a.usage,Array.from({length:112},(_,k)=>{const u=k+4;return [u,`${usageNames[u]||'Usage'} (0x${u.toString(16).padStart(2,'0')})`];}),v=>a.usage=Number(v)));}
card.append(fields);if(a.protocol==='keyboard'&&a.message==='keyDown'){const mods=document.createElement('div');mods.className='modifiers';['L Ctrl','L Shift','L Alt','L GUI','R Ctrl','R Shift','R Alt','R GUI'].forEach((name,bit)=>{const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!(a.modifiers&(1<<bit));cb.onchange=()=>{a.modifiers=cb.checked?a.modifiers|(1<<bit):a.modifiers&~(1<<bit);changed();};label.append(cb,document.createTextNode(name));mods.append(label);});card.append(mods);}list.append(card);});if(!actions.length){const p=document.createElement('p');p.className='hint';p.textContent='このEventにはActionがありません。';list.append(p);}$('add').disabled=actions.length>=8;}
function selectInput(group){selected=group*2;$('title').textContent=names[group];$('event').replaceChildren();const labels=group===13?['Clockwise','Counterclockwise']:['Press','Release'];labels.forEach((name,i)=>{const o=document.createElement('option');o.value=group*2+i;o.textContent=name;$('event').append(o);});[...$('inputs').children].forEach((b,i)=>b.classList.toggle('active',i===group));renderActions();}
async function load(){[config,capabilities]=await Promise.all([api('config'),api('capabilities')]);for(const id of ['ssid','password','oscHost','oscPort'])$(id).value=config.network[id];dirty=false;$('dirty').textContent='保存済み';selectInput(Math.floor(selected/2));message('設定を読み込みました。');}
async function status(){try{const s=await api('status');$('connections').replaceChildren();for(const [key,label]of [['wifi','Wi-Fi'],['usbMidi','USB MIDI'],['usbKeyboard','USB HID'],['bleMidi','BLE MIDI'],['bleKeyboard','BLE HID']]){const unsupported=(key==='usbMidi'&&s.usbMidiSupported===false)||(key==='usbKeyboard'&&s.usbKeyboardSupported===false);const tag=document.createElement('span');tag.className='tag'+(!unsupported&&s[key]?' on':'');tag.textContent=`${label}: ${unsupported?'非対応':s[key]?'接続':'未接続'}`;$('connections').append(tag);}$('stats').textContent=`${s.hardware||'ChainPad'} · IP ${s.ip} / AP ${s.apIp} · Events ${s.events} · Accepted ${s.accepted} · Skipped ${s.skipped} · Last ${s.lastInput} #${s.lastAction} ${s.lastResult} · Overflow input/output ${s.inputOverflows}/${s.transportOverflows} · Retry ${s.transportRetries} · ${s.bootMessage}${s.restartRequired?' · Wi-Fi設定変更: Restart必要':''}${!s.inputsReady?' · INPUT ERROR':''}`;}catch(e){$('connections').textContent='デバイスに接続できません: '+e.message;}finally{statusTimer=setTimeout(status,1500);}}
function run(fn){return async()=>{try{await fn();}catch(e){message(e.message,true);}};}
$('event').onchange=()=>{selected=Number($('event').value);renderActions();};
$('add').onclick=()=>{current().push(defaults('osc'));changed();renderActions();};
$('save').onclick=run(async()=>{for(const id of ['ssid','password','oscHost','oscPort'])config.network[id]=id==='oscPort'?Number($(id).value):$(id).value;const r=await api('config','PUT',config);dirty=false;$('dirty').textContent='保存済み';message(r.message);});
$('reload').onclick=run(async()=>{if(!dirty||confirm('未保存の変更を破棄しますか？'))await load();});
$('trigger').onclick=run(async()=>{if(dirty){message('テストの前に変更を保存してください。',true);return;}message((await api('trigger','POST',{input:selected})).message);});
$('panic').onclick=run(async()=>message((await api('panic','POST')).message));
$('restart').onclick=run(async()=>{if(dirty&&!confirm('未保存の変更があります。Restartしますか？'))return;message((await api('restart','POST')).message);});
$('networkSave').onclick=()=>{if(config)$('save').click();};
$('networkRestart').onclick=()=>$('restart').click();
$('example').onclick=()=>{if(!config)return;const base=Math.floor(selected/2)*2;if(base===26){message('設定例はキーまたはEncoder Pushで使用してください。',true);return;}if((config.chains[base].actions.length||config.chains[base+1].actions.length)&&!confirm('このInputのPress / Releaseを設定例で置き換えますか？'))return;config.chains[base].actions=[defaults('osc'),defaults('midi'),defaults('keyboard')];config.chains[base+1].actions=[{...defaults('osc'),value:0},{...defaults('midi'),message:'noteOff',value:0},{...defaults('keyboard'),message:'keyUp'}];changed();renderActions();const midi=capabilities.usbMidi?'USB + BLE':'BLE';message(`Press: OSC int 2 → ${midi} Note On → BLE F13 Down\nRelease: OSC int 0 → ${midi} Note Off → BLE F13 Up\n送信先を設定し、保存してから実機で確認してください。`);};
for(const id of ['ssid','password','oscHost','oscPort'])$(id).oninput=changed;
names.forEach((name,i)=>$('inputs').append(button(name,()=>{if(config)selectInput(i);})));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
run(load)();status();
</script>
</html>
