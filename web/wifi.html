<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChainPad — Wi-Fi設定</title>
<style>
:root{color-scheme:light dark;font:16px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px;background:#f3f6f8;color:#182a38}main{max-width:440px;margin:8vh auto;background:#fff;padding:28px;border:1px solid #bdcbd5;border-radius:12px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.6;color:#506275}label{display:grid;gap:8px;margin:20px 0}input,button{width:100%;font:inherit;padding:12px;border:1px solid #bdcbd5;border-radius:7px}input{background:#f8fafc;color:inherit}button{background:#087565;color:#fff;cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:default}#message{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:0}.error{color:#b42318!important}@media(prefers-color-scheme:dark){body{background:#10151d;color:#eef5ff}main{background:#1b2330;border-color:#374557}input{background:#111923;border-color:#374557}p{color:#a9b8cc}.error{color:#ff9d99!important}}
</style>
<main>
<h1>ChainPad Wi-Fi設定</h1>
<p>接続先のWi-Fi情報を入力してください。保存すると本体が再起動します。</p>
<form id="wifi">
<label>SSID<input id="ssid" maxlength="32" autocomplete="off" required></label>
<label>パスワード<input id="password" type="password" maxlength="64" autocomplete="new-password"></label>
<button id="save" disabled>保存して再起動</button>
</form>
<p id="message" role="status">設定を読み込み中…</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error);}
async function api(method,body){const response=await fetch('/api/wifi',{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.message||'設定に失敗しました。');return data;}
api('GET').then(data=>{$('ssid').value=data.ssid;$('password').value=data.password;$('save').disabled=false;message('パスワードのないWi-Fiでは空欄にしてください。');}).catch(()=>message('設定を読み込めません。ChainPad-Setupへの接続を確認して画面を開き直してください。',true));
$('wifi').onsubmit=async event=>{event.preventDefault();$('save').disabled=true;message('保存中…');try{await api('PUT',{ssid:$('ssid').value,password:$('password').value});$('ssid').disabled=true;$('password').disabled=true;message('保存しました。本体を再起動しています。\n再起動後は接続先のWi-Fiに戻ってChainPadを使用してください。設定をやり直す場合はChainPad-Setupに再接続してください。');}catch(error){message(error.message,true);$('save').disabled=false;}};
</script>
</html>
